<!-- Backend Engineering — Milestone Tracker -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
  :root{
    --black:#000000;
    --panel:#0a0a0a;
    --panel-2:#111111;
    --line:#221418;
    --white:#ffffff;
    --pink:#ffe1ea;
    --pink-dim:#ffe1ea99;
    --pink-glow:#ffb9cf;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--black);}
  #bet-root{
    background:var(--black);
    color:var(--pink);
    font-family:'DM Sans',-apple-system,'Segoe UI',sans-serif;
    padding:28px 18px 60px;
    min-height:100%;
    position:relative;
    overflow-x:hidden;
  }
  #bet-root .sans{font-family:'DM Sans',-apple-system,'Segoe UI',sans-serif;}

  .bet-header{text-align:center;margin-bottom:8px;}
  .bet-eyebrow{
    font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    letter-spacing:.28em;text-transform:uppercase;font-size:11px;
    color:var(--pink-dim);margin:0 0 10px;
  }
  .bet-title{
    color:var(--white);font-family:'Playfair Display',Georgia,serif;font-size:clamp(26px,5vw,38px);font-weight:600;
    margin:0;letter-spacing:.01em;
  }
  .bet-sub{
    color:var(--pink-dim);font-size:14px;margin:10px 0 0;
    font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  .bet-progress-wrap{max-width:640px;margin:26px auto 34px;}
  .bet-progress-track{
    height:6px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:4px;overflow:hidden;
  }
  .bet-progress-fill{
    height:100%;background:linear-gradient(90deg,var(--pink-glow),var(--pink));
    width:0%;transition:width .5s ease;
  }
  .bet-progress-label{
    font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size:12px;color:var(--pink-dim);text-align:right;margin-top:6px;letter-spacing:.03em;
  }

  .bet-phase-header{
    max-width:640px;margin:30px auto 12px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .bet-phase-eyebrow{
    font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--pink-dim);
  }
  .bet-phase-title{color:var(--white);font-size:19px;font-weight:600;margin:4px 0 0;}

  .bet-weeks{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}

  .bet-week{border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden;}
  .bet-week-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 18px;cursor:pointer;user-select:none;
  }
  .bet-week-head:hover{background:var(--panel-2);}
  .bet-week-num{
    font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size:10px;letter-spacing:.22em;color:var(--pink-dim);text-transform:uppercase;
  }
  .bet-week-title{color:var(--white);font-size:17px;margin:2px 0 0;font-weight:600;}
  .bet-week-meta{
    font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size:12px;color:var(--pink-dim);white-space:nowrap;
  }
  .bet-chevron{color:var(--pink-dim);font-size:14px;transition:transform .25s ease;flex-shrink:0;}
  .bet-week.open .bet-chevron{transform:rotate(90deg);}

  .bet-week-body{max-height:0;overflow:hidden;transition:max-height .35s ease;border-top:1px solid transparent;}
  .bet-week.open .bet-week-body{border-top:1px solid var(--line);}

  .bet-section-label{
    font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--pink-dim);
    padding:14px 18px 6px;
  }

  .bet-item{display:flex;align-items:flex-start;gap:12px;padding:9px 18px;position:relative;}
  .bet-box{
    flex-shrink:0;width:19px;height:19px;margin-top:2px;border-radius:50%;
    border:1.5px solid var(--pink-dim);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .2s ease;background:transparent;
  }
  .bet-box.checked{background:var(--pink);border-color:var(--pink);box-shadow:0 0 12px var(--pink-glow);}
  .bet-box.checked::after{content:'✓';color:var(--black);font-size:12px;font-weight:bold;font-family:-apple-system, sans-serif;}
  .bet-item-text{font-size:14px;line-height:1.5;color:var(--pink);cursor:pointer;}
  .bet-item-text.checked{color:var(--pink-dim);text-decoration:line-through;text-decoration-color:var(--pink-dim);}

  .bet-weekly-block{
    margin:6px 18px 16px;padding:12px 14px;border:1px solid var(--line);
    border-radius:8px;background:var(--panel-2);
  }

  .bet-exam-block{margin:0 18px 18px;padding:14px;border:1px dashed var(--line);border-radius:8px;}
  .bet-exam-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .bet-exam-label{
    font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size:12px;letter-spacing:.05em;color:var(--pink-dim);
  }
  .bet-exam-input{
    width:88px;background:var(--black);border:1px solid var(--pink-dim);color:var(--pink);
    font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14px;
    padding:7px 10px;border-radius:6px;outline:none;
  }
  .bet-exam-input:focus{border-color:var(--pink);}
  .bet-exam-input::placeholder{color:var(--pink-dim);opacity:.6;}
  .bet-exam-save{
    background:transparent;border:1px solid var(--pink-dim);color:var(--pink);
    font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px;
    letter-spacing:.05em;padding:7px 14px;border-radius:6px;cursor:pointer;transition:.2s;
  }
  .bet-exam-save:hover{background:var(--pink);color:var(--black);}
  .bet-exam-result{
    font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size:13px;margin-top:8px;min-height:18px;
  }
  .bet-exam-result.pass{color:var(--pink);}
  .bet-exam-result.retry{color:var(--pink-dim);}

  .bet-footer-note{
    text-align:center;font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size:11px;color:var(--pink-dim);margin-top:30px;opacity:.7;
  }

  /* celebration: small burst for a single milestone check */
  .bet-burst{position:fixed;pointer-events:none;font-size:18px;z-index:9999;animation:bet-burst-anim 850ms ease-out forwards;}
  @keyframes bet-burst-anim{
    0%{transform:translate(0,0) scale(.6) rotate(0deg);opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot));opacity:0;}
  }

  /* celebration: full-page confetti rain for a passed exam */
  .bet-confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden;}
  .bet-confetti-piece{position:absolute;top:-40px;opacity:0;animation-name:bet-confetti-fall;animation-timing-function:cubic-bezier(.35,0,.65,1);animation-fill-mode:forwards;}
  @keyframes bet-confetti-fall{
    0%{transform:translate(0,0) rotate(0deg);opacity:1;}
    85%{opacity:1;}
    100%{transform:translate(var(--dx),var(--fall)) rotate(var(--rot));opacity:0;}
  }
  .bet-firework{position:fixed;pointer-events:none;font-size:26px;z-index:9998;animation:bet-firework-anim 1100ms ease-out forwards;}
  @keyframes bet-firework-anim{
    0%{transform:translate(0,0) scale(.3);opacity:0;}
    25%{opacity:1;transform:translate(0,0) scale(1.3);}
    100%{transform:translate(var(--dx),var(--dy)) scale(.8);opacity:0;}
  }
  .bet-flash{
    position:fixed;inset:0;pointer-events:none;z-index:9997;
    background:radial-gradient(circle at 50% 40%, rgba(255,225,234,.35), rgba(255,225,234,0) 65%);
    opacity:0;animation:bet-flash-anim 900ms ease-out forwards;
  }
  @keyframes bet-flash-anim{0%{opacity:0;}15%{opacity:1;}100%{opacity:0;}}

  .bet-toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--white);color:var(--black);
    font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size:13px;font-weight:600;padding:11px 20px;border-radius:999px;
    opacity:0;transition:all .35s ease;z-index:9999;box-shadow:0 8px 24px rgba(255,225,234,.15);
  }
  .bet-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .bet-toast.big{
    font-size:16px;padding:14px 26px;
    background:linear-gradient(90deg,#ffd166,#ff6b9d,#c084fc,#5eead4);
    color:#000;box-shadow:0 10px 34px rgba(255,150,200,.35);
  }

  @media (prefers-reduced-motion: reduce){
    .bet-burst, .bet-toast, .bet-progress-fill, .bet-week-body,
    .bet-confetti-piece, .bet-firework, .bet-flash{animation:none!important;transition:none!important;}
  }
  @media (max-width:480px){
    #bet-root{padding:24px 14px 48px;}
    .bet-eyebrow{font-size:10px;letter-spacing:.18em;}
    .bet-title{font-size:30px;}
    .bet-sub{font-size:15px;line-height:1.55;}
    .bet-progress-wrap{margin:22px auto 28px;}
    .bet-phase-header{margin:26px auto 11px;}
    .bet-phase-title{font-size:18px;line-height:1.35;}
    .bet-week-head{padding:16px 14px;align-items:flex-start;min-height:70px;}
    .bet-week-title{font-size:16px;line-height:1.35;}
    .bet-week-meta{white-space:normal;text-align:right;line-height:1.45;}
    .bet-section-label{padding:15px 14px 7px;}
    .bet-item{gap:11px;padding:12px 14px;}
    .bet-box{width:24px;height:24px;margin-top:0;}
    .bet-item-text{font-size:15px;line-height:1.55;padding-top:1px;}
    .bet-weekly-block{margin:7px 14px 16px;padding:13px;}
    .bet-exam-block{margin:0 14px 18px;padding:13px;}
    .bet-exam-row{gap:8px;}
    .bet-exam-input{flex:1;min-width:0;height:42px;font-size:16px;}
    .bet-exam-save{height:42px;padding:7px 12px;font-size:12px;}
    .bet-toast{max-width:calc(100% - 28px);text-align:center;bottom:18px;}
  }
</style>

<div id="bet-root">
  <div class="bet-header">
    <p class="bet-eyebrow">Backend Engineering</p>
    <h1 class="bet-title">Milestone Tracker</h1>
    <p class="bet-sub">HTTP → APIs → Performance → Scale → Architecture</p>
  </div>

  <div class="bet-progress-wrap">
    <div class="bet-progress-track"><div class="bet-progress-fill" id="bet-progress-fill"></div></div>
    <div class="bet-progress-label" id="bet-progress-label">0 / 0 milestones</div>
  </div>

  <div id="bet-phases"></div>

  <p class="bet-footer-note">Tap a week to open it · progress saves automatically</p>
</div>

<div class="bet-toast" id="bet-toast"></div>

<script>
(function(){
  const PHASES = [
    {
      title: "Phase 1 — Request Fundamentals",
      weeks: [
        {
          title: "HTTP, Routing & Middleware",
          weekly: "Trace a request end-to-end: DNS → HTTPS → routing → middleware → controller.",
          daily: [
            "Explain how an HTTP request/response cycle works",
            "Explain how DNS resolves a domain to an IP",
            "Explain HTTPS/TLS and why it matters for APIs",
            "Implement routing for incoming requests",
            "Write and apply middleware to a request pipeline",
            "Build a controller that handles a request"
          ]
        },
        {
          title: "Services, Repositories & DI",
          weekly: "Explain how controllers, services, repositories, and models fit together, wired by DI.",
          daily: [
            "Extract business logic into a service layer",
            "Build a repository to abstract data access",
            "Define models that represent your domain data",
            "Apply dependency injection instead of hardcoding dependencies",
            "Understand how an app bootstraps and wires everything together",
            "Handle Request & Response objects cleanly"
          ]
        }
      ]
    },
    {
      title: "Phase 2 — API Design & Security",
      weeks: [
        {
          title: "API Design, REST & Validation",
          weekly: "Design and secure a REST API with proper validation and authentication.",
          daily: [
            "Design a clean, consistent API surface",
            "Apply REST principles to resource endpoints",
            "Work confidently with JSON request/response bodies",
            "Validate incoming request data properly",
            "Implement authentication for API users"
          ]
        },
        {
          title: "Auth, Sessions & OAuth",
          weekly: "Secure an API with sessions, JWTs, and OAuth, and handle file uploads safely.",
          daily: [
            "Implement authorization checks beyond authentication",
            "Manage user sessions correctly",
            "Issue and verify JWTs",
            "Implement an OAuth flow",
            "Handle file uploads securely"
          ]
        },
        {
          title: "Email, Pagination & Versioning",
          weekly: "Ship a production-ready API: emails, pagination, filtering, search, and versioning.",
          daily: [
            "Send transactional emails from the backend",
            "Implement pagination for large result sets",
            "Implement filtering on API endpoints",
            "Implement search functionality",
            "Version an API without breaking existing clients"
          ]
        }
      ]
    },
    {
      title: "Phase 3 — Performance & Background Work",
      weeks: [
        {
          title: "Caching, Redis & Queues",
          weekly: "Offload work from the request cycle using caching, queues, and workers.",
          daily: [
            "Apply caching to reduce repeated work",
            "Use Redis as a cache/data store",
            "Push work onto a queue instead of processing inline",
            "Define and dispatch background jobs",
            "Run workers that process queued jobs"
          ]
        },
        {
          title: "Rate Limiting & Optimization",
          weekly: "Protect and optimize a service under load with rate limiting and indexing.",
          daily: [
            "Design reliable background processing workflows",
            "Implement rate limiting on an API",
            "Apply throttling to protect a service",
            "Optimize a slow endpoint or query",
            "Add database indexes to speed up lookups"
          ]
        }
      ]
    },
    {
      title: "Phase 4 — Infrastructure & Scale",
      weeks: [
        {
          title: "Docker, Nginx & CDN",
          weekly: "Explain how a containerized app is served through Nginx, a load balancer, and a CDN.",
          daily: [
            "Containerize an application with Docker",
            "Explain when and why to split into microservices",
            "Explain how a load balancer distributes traffic",
            "Explain how a CDN serves content closer to users",
            "Configure Nginx as a reverse proxy"
          ]
        },
        {
          title: "Scaling, Replication & Observability",
          weekly: "Explain how a system scales horizontally with replicated databases, monitoring, and logging.",
          daily: [
            "Scale an application horizontally",
            "Explain database scaling considerations",
            "Set up database replication",
            "Set up monitoring for a production service",
            "Implement structured logging"
          ]
        }
      ]
    },
    {
      title: "Phase 5 — Architecture",
      weeks: [
        {
          title: "Events, DDD & Clean Architecture",
          weekly: "Architect a backend system using DDD, hexagonal/clean architecture, and the right design patterns.",
          daily: [
            "Apply an event-driven pattern to decouple components",
            "Explain CQRS and when to use it",
            "Apply Domain-Driven Design concepts to a project",
            "Explain Hexagonal Architecture",
            "Explain Clean Architecture",
            "Apply common design patterns appropriately"
          ]
        }
      ]
    }
  ];

  // pre-seed the items already marked done in the source curriculum (Phase 1, weeks 1 & first two of week 2)
  const DEFAULT_CHECKS = {
    "d-0-0-0": true, "d-0-0-1": true, "d-0-0-2": true, "d-0-0-3": true, "d-0-0-4": true, "d-0-0-5": true,
    "d-0-1-0": true, "d-0-1-1": true
  };

  const STORAGE_KEY = "backend-curriculum-progress";
  let state = { checks: {}, exams: {} };
  const toastEl = document.getElementById('bet-toast');
  const phasesEl = document.getElementById('bet-phases');

  const CELEBRATE_EMOJI = ['🚀'];
  const CONFETTI_COLORS = ['#ff6b9d','#ffd166','#5eead4','#c084fc','#60a5fa','#ff9776','#a3e635','#f472b6'];
  const FIREWORK_EMOJI = ['🎉','✨','🎊','⭐'];

  function showToast(msg, big){
    toastEl.textContent = msg;
    toastEl.className = 'bet-toast show' + (big ? ' big' : '');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>{ toastEl.classList.remove('show'); }, big ? 3200 : 1800);
  }

  function burst(x, y){
    for(let i=0;i<8;i++){
      const el = document.createElement('div');
      el.className = 'bet-burst';
      el.textContent = CELEBRATE_EMOJI[Math.floor(Math.random()*CELEBRATE_EMOJI.length)];
      el.style.left = x+'px';
      el.style.top = y+'px';
      el.style.color = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
      const angle = Math.random()*Math.PI*2;
      const dist = 30+Math.random()*40;
      el.style.setProperty('--dx', Math.cos(angle)*dist+'px');
      el.style.setProperty('--dy', Math.sin(angle)*dist+'px');
      el.style.setProperty('--rot', (Math.random()*360-180)+'deg');
      document.body.appendChild(el);
      setTimeout(()=>el.remove(), 900);
    }
  }

  function celebratePage(){
    const vw = window.innerWidth, vh = window.innerHeight;

    const flash = document.createElement('div');
    flash.className = 'bet-flash';
    document.body.appendChild(flash);
    setTimeout(()=>flash.remove(), 950);

    const layer = document.createElement('div');
    layer.className = 'bet-confetti-layer';
    document.body.appendChild(layer);

    const pieceCount = 140;
    for(let i=0;i<pieceCount;i++){
      const piece = document.createElement('div');
      piece.className = 'bet-confetti-piece';
      const color = CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
      const isCircle = Math.random() > 0.5;
      const size = 6 + Math.random()*7;
      piece.style.left = (Math.random()*vw)+'px';
      piece.style.width = size+'px';
      piece.style.height = (isCircle ? size : size*2.2)+'px';
      piece.style.background = color;
      piece.style.borderRadius = isCircle ? '50%' : '2px';
      const fall = vh + 80;
      const drift = (Math.random()*220-110);
      const rot = (Math.random()*720-360);
      piece.style.setProperty('--fall', fall+'px');
      piece.style.setProperty('--dx', drift+'px');
      piece.style.setProperty('--rot', rot+'deg');
      const duration = 2200 + Math.random()*1800;
      const delay = Math.random()*500;
      piece.style.animationDuration = duration+'ms';
      piece.style.animationDelay = delay+'ms';
      layer.appendChild(piece);
    }
    setTimeout(()=>layer.remove(), 4600);

    const fireworkSpots = 5;
    for(let i=0;i<fireworkSpots;i++){
      setTimeout(()=>{
        const x = vw*0.15 + Math.random()*vw*0.7;
        const y = vh*0.15 + Math.random()*vh*0.5;
        for(let j=0;j<6;j++){
          const fw = document.createElement('div');
          fw.className = 'bet-firework';
          fw.textContent = FIREWORK_EMOJI[Math.floor(Math.random()*FIREWORK_EMOJI.length)];
          fw.style.left = x+'px';
          fw.style.top = y+'px';
          const angle = Math.random()*Math.PI*2;
          const dist = 50+Math.random()*70;
          fw.style.setProperty('--dx', Math.cos(angle)*dist+'px');
          fw.style.setProperty('--dy', Math.sin(angle)*dist+'px');
          document.body.appendChild(fw);
          setTimeout(()=>fw.remove(), 1200);
        }
      }, i*300);
    }
  }

  async function load(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        state = Object.assign({checks:{}, exams:{}}, parsed);
      } else {
        state.checks = Object.assign({}, DEFAULT_CHECKS);
      }
    }catch(e){
      state.checks = Object.assign({}, DEFAULT_CHECKS);
    }
    render();
  }

  async function save(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    }catch(e){ console.error('Save failed', e); }
  }

  function updateProgress(){
    let total = 0, done = 0;
    PHASES.forEach((phase, pi)=>{
      phase.weeks.forEach((w, wi)=>{
        w.daily.forEach((_, di)=>{
          total++;
          if(state.checks[`d-${pi}-${wi}-${di}`]) done++;
        });
        total++;
        if(state.checks[`w-${pi}-${wi}`]) done++;
      });
    });
    const pct = total ? Math.round((done/total)*100) : 0;
    document.getElementById('bet-progress-fill').style.width = pct+'%';
    document.getElementById('bet-progress-label').textContent = `${done} / ${total} milestones`;
  }

  function toggle(key, evt){
    const rect = evt ? evt.currentTarget.getBoundingClientRect() : null;
    state.checks[key] = !state.checks[key];
    const justChecked = state.checks[key];
    save();
    render();
    updateProgress();
    if(justChecked && rect){
      burst(rect.left+10, rect.top+10);
    }
  }

  async function submitExam(examKey, label, inputEl, resultEl){
    const val = parseInt(inputEl.value, 10);
    if(isNaN(val) || val < 0 || val > 100){
      resultEl.textContent = "Enter a score between 0 and 100";
      resultEl.className = "bet-exam-result retry";
      return;
    }
    state.exams[examKey] = val;
    await save();
    if(val >= 80){
      resultEl.textContent = `${val}% — passed with room to spare ✦`;
      resultEl.className = "bet-exam-result pass";
      celebratePage();
      showToast(`${label} exam cleared — ${val}%`, true);
    }else{
      resultEl.textContent = `${val}% — below 80, worth another pass`;
      resultEl.className = "bet-exam-result retry";
    }
  }

  function render(){
    phasesEl.innerHTML = '';
    let globalWeekIndex = 0;

    PHASES.forEach((phase, pi)=>{
      const phaseHeader = document.createElement('div');
      phaseHeader.className = 'bet-phase-header';
      phaseHeader.innerHTML = `<div class="bet-phase-eyebrow">Phase ${pi+1}</div><div class="bet-phase-title">${phase.title.replace(/^Phase \d+ — /,'')}</div>`;
      phasesEl.appendChild(phaseHeader);

      const weeksWrap = document.createElement('div');
      weeksWrap.className = 'bet-weeks';

      phase.weeks.forEach((w, wi)=>{
        globalWeekIndex++;
        const weekDiv = document.createElement('div');
        weekDiv.className = 'bet-week';
        if(weekDiv._open) weekDiv.classList.add('open');

        const head = document.createElement('div');
        head.className = 'bet-week-head';

        const doneDaily = w.daily.filter((_,di)=>state.checks[`d-${pi}-${wi}-${di}`]).length;
        const weeklyDone = state.checks[`w-${pi}-${wi}`];
        const examKey = `e-${pi}-${wi}`;
        const examScore = state.exams[examKey];

        head.innerHTML = `
          <div>
            <div class="bet-week-num">Week ${globalWeekIndex}</div>
            <div class="bet-week-title">${w.title}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="bet-week-meta">${doneDaily}/${w.daily.length}${weeklyDone?' · ✓ mastery':''}${examScore!==undefined?' · exam '+examScore+'%':''}</div>
            <div class="bet-chevron">›</div>
          </div>`;

        const body = document.createElement('div');
        body.className = 'bet-week-body';

        const dailyLabel = document.createElement('div');
        dailyLabel.className = 'bet-section-label';
        dailyLabel.textContent = 'Daily milestones';
        body.appendChild(dailyLabel);

        w.daily.forEach((text, di)=>{
          const key = `d-${pi}-${wi}-${di}`;
          const checked = !!state.checks[key];
          const item = document.createElement('div');
          item.className = 'bet-item';
          item.innerHTML = `
            <div class="bet-box ${checked?'checked':''}"></div>
            <div class="bet-item-text ${checked?'checked':''}">${text}</div>`;
          const doToggle = (e)=>toggle(key, e);
          item.querySelector('.bet-box').addEventListener('click', doToggle);
          item.querySelector('.bet-item-text').addEventListener('click', doToggle);
          body.appendChild(item);
        });

        const weeklyLabel = document.createElement('div');
        weeklyLabel.className = 'bet-section-label';
        weeklyLabel.textContent = 'Weekly mastery milestone';
        body.appendChild(weeklyLabel);

        const weeklyBlock = document.createElement('div');
        weeklyBlock.className = 'bet-weekly-block';
        const wKey = `w-${pi}-${wi}`;
        const wChecked = !!state.checks[wKey];
        weeklyBlock.innerHTML = `
          <div class="bet-item" style="padding:0;">
            <div class="bet-box ${wChecked?'checked':''}"></div>
            <div class="bet-item-text ${wChecked?'checked':''}">${w.weekly}</div>
          </div>`;
        const wToggle = (e)=>toggle(wKey, e);
        weeklyBlock.querySelector('.bet-box').addEventListener('click', wToggle);
        weeklyBlock.querySelector('.bet-item-text').addEventListener('click', wToggle);
        body.appendChild(weeklyBlock);

        const examLabel = document.createElement('div');
        examLabel.className = 'bet-section-label';
        examLabel.textContent = 'Weekly exam score';
        body.appendChild(examLabel);

        const examBlock = document.createElement('div');
        examBlock.className = 'bet-exam-block';
        examBlock.innerHTML = `
          <div class="bet-exam-row">
            <span class="bet-exam-label">Score</span>
            <input type="number" min="0" max="100" class="bet-exam-input" placeholder="0–100" value="${examScore!==undefined?examScore:''}">
            <button class="bet-exam-save">Save score</button>
          </div>
          <div class="bet-exam-result ${examScore!==undefined?(examScore>=80?'pass':'retry'):''}">${
            examScore!==undefined
              ? (examScore>=80 ? `${examScore}% — passed with room to spare ✦` : `${examScore}% — below 80, worth another pass`)
              : ''
          }</div>`;
        const input = examBlock.querySelector('.bet-exam-input');
        const btn = examBlock.querySelector('.bet-exam-save');
        const resultEl = examBlock.querySelector('.bet-exam-result');
        btn.addEventListener('click', ()=>submitExam(examKey, `Week ${globalWeekIndex}`, input, resultEl));
        input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitExam(examKey, `Week ${globalWeekIndex}`, input, resultEl); });
        body.appendChild(examBlock);

        head.addEventListener('click', ()=>{
          const isOpen = weekDiv.classList.toggle('open');
          weekDiv._open = isOpen;
          body.style.maxHeight = isOpen ? body.scrollHeight + 'px' : '0px';
        });

        weekDiv.appendChild(head);
        weekDiv.appendChild(body);
        weeksWrap.appendChild(weekDiv);
      });

      phasesEl.appendChild(weeksWrap);
    });
  }

  load().then(updateProgress);
})();
</script>
